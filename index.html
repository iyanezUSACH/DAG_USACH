<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Service Area Farmacias - Plaza Ñuñoa</title>
    <link rel="stylesheet" href="https://js.arcgis.com/4.30/esri/themes/light/main.css" />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://js.arcgis.com/4.30/"></script>
  </head>
  <body>
    <div id="viewDiv" aria-label="Mapa ArcGIS"></div>

    <aside id="panel" aria-label="Panel de análisis">
      <h1>Service Area</h1>
      <p class="hint">Busca una farmacia (ej: <em>Farmacia Cruz Verde en Plaza Ñuñoa</em>), elige modo y calcula cobertura.</p>

      <label for="arcgisKey">ArcGIS API Key</label>
      <input id="arcgisKey" type="password" placeholder="AAPK..." autocomplete="off" />

      <label for="claudeProxy">Claude Proxy URL (opcional)</label>
      <input id="claudeProxy" type="url" placeholder="https://tu-worker/claude" autocomplete="off" />

      <label for="placeInput">Lugar a geocodificar</label>
      <textarea id="placeInput" rows="2">farmacia en plaza ñuñoa</textarea>

      <div class="row">
        <div>
          <label for="mode">Modo</label>
          <select id="mode">
            <option value="Walking Time">A pie</option>
            <option value="Driving Time">En auto</option>
          </select>
        </div>

        <div>
          <label for="breaks">Minutos</label>
          <input id="breaks" type="text" value="5,10,15" />
        </div>
      </div>

      <button id="runBtn">Calcular service area</button>

      <h2>Análisis</h2>
      <pre id="analysis">Aún sin análisis.</pre>

      <h2>Log</h2>
      <pre id="log"></pre>
    </aside>

    <script src="script.js"></script>
  </body>
</html>
